<!doctype html>
<html lang="en">
	<head>
		<title>Decal Splatter</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/guspira@0.2.0/dist/guspira.min.css">
		<style>
			*{ box-sizing: border-box; margin: 0; padding: 0 }
			body {
				color: #888;
				font-family: tahoma, sans-serif;
				font-size: 13px;
				background-color: #222;
				overflow: hidden;
				text-shadow: 0 1px 0 rgba( 0,0,0,.5 )
			}
			.intro{ position: absolute; left: 10px; top: 10px; line-height: 1.4em; pointer-events: none; }
			.intro a{ pointer-events: auto; }
			a{ color: inherit }
			#container canvas{ position: absolute; left: 0; top: 0; width: 100%; height: 100%; bottom: 0; display: block; }
			b{ color: #aaa;}
			#gui-container{ position: absolute; right: 0; top: 0; width: 300px; max-height: 100%; overflow: auto; text-shadow: none; }
		</style>
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>

		<div id="container"></div>
		<div id="gui-container"></div>
		<div class="intro">
			<p><b>Decal Splatter</b> | Click or tap and drag to rotate, mouse wheel or pinch to zoom, click or tap to shoot paint.</p>
			<p>Find the code here: <b><a href="https://github.com/spite/THREE.DecalGeometry" >THREE.DecalGeometry on GitHub</a></b> | <a href="intersection.html">The box and what it cuts</a></p>
		</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GUI, signal, effect } from 'https://cdn.jsdelivr.net/npm/guspira@0.2.0/dist/guspira.min.js';
import { DecalBatch, prepareAsync } from '../src/THREE.DecalGeometry.js';

// the colors as three.js used them when this was made, to look as it did
THREE.ColorManagement.enabled = false;

const container = document.getElementById( 'container' );

const renderer = new THREE.WebGLRenderer( { antialias: true } );
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio( window.devicePixelRatio );
renderer.setSize( window.innerWidth, window.innerHeight );
container.appendChild( renderer.domElement );

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 1000 );
camera.position.set( 0, - 8, 125 );

const controls = new OrbitControls( camera, renderer.domElement );
controls.target.set( 0, - 8, 0 );
controls.update();

// the lights of the original, with what got to the head from where each one was
scene.add( new THREE.AmbientLight( 0x111111, Math.PI ) );

const orange = new THREE.PointLight( 0xff5500, Math.PI * .5, 0, 0 );
orange.position.z = 1000;
scene.add( orange );

const blue = new THREE.PointLight( 0x0000ff, Math.PI * .3, 0, 0 );
blue.position.set( - 1000, 0, 1000 );
scene.add( blue );

const white = new THREE.DirectionalLight( 0xaaaaaa, Math.PI );
white.position.set( 100, 50, 100 );
scene.add( white );

const loader = new THREE.TextureLoader();
const texture = name => loader.load( 'assets/' + name );

// four splats in one texture: the one of the original, and three that are made here. Each decal takes one
const CELL = 512;
const atlas = document.createElement( 'canvas' );
atlas.width = atlas.height = CELL * 2;

const splats = new THREE.CanvasTexture( atlas );
splats.anisotropy = 4;

const cells = [ [ 0, .5, .5, 1 ], [ .5, .5, 1, 1 ], [ 0, 0, .5, .5 ], [ .5, 0, 1, .5 ] ];

// blobs that add up, and are cut where they are half of the way: they join as paint does
function drawSplat( x, y ) {

	const canvas = document.createElement( 'canvas' );
	canvas.width = canvas.height = CELL;

	const ctx = canvas.getContext( '2d' );
	ctx.globalCompositeOperation = 'lighter';

	const blob = function ( bx, by, r ) {

		const gradient = ctx.createRadialGradient( bx, by, 0, bx, by, r * 2 );
		gradient.addColorStop( 0, 'rgba(255,255,255,1)' );
		gradient.addColorStop( 1, 'rgba(255,255,255,0)' );
		ctx.fillStyle = gradient;
		ctx.fillRect( bx - r * 2, by - r * 2, r * 4, r * 4 );

	};

	const c = CELL / 2;

	blob( c, c, CELL * ( .13 + .05 * Math.random() ) );

	// drops that leave the middle, smaller the further they get
	for ( let i = 0; i < 16; i ++ ) {

		const angle = Math.random() * Math.PI * 2;
		const reach = .12 + .26 * Math.random();
		const steps = 2 + Math.floor( Math.random() * 5 );

		for ( let j = 0; j < steps; j ++ ) {

			const d = CELL * reach * ( 1 - j / ( steps + 2 ) );

			blob( c + Math.cos( angle ) * d, c + Math.sin( angle ) * d, CELL * ( .012 + .035 * Math.random() * ( 1 - reach ) ) );

		}

	}

	const image = ctx.getImageData( 0, 0, CELL, CELL );
	const data = image.data;

	for ( let i = 0; i < data.length; i += 4 ) {

		const a = Math.min( 1, Math.max( 0, ( data[ i + 3 ] / 255 - .45 ) / .1 ) );

		data[ i ] = data[ i + 1 ] = data[ i + 2 ] = 255;
		data[ i + 3 ] = 255 * a * a * ( 3 - 2 * a );

	}

	ctx.putImageData( image, 0, 0 );
	atlas.getContext( '2d' ).drawImage( canvas, x, y );

}

drawSplat( CELL, 0 );
drawSplat( 0, CELL );
drawSplat( CELL, CELL );

new THREE.ImageLoader().load( 'assets/white-splatter.png', function ( image ) {

	atlas.getContext( '2d' ).drawImage( image, 0, 0, CELL, CELL );
	splats.needsUpdate = true;

} );

const decalMaterial = new THREE.MeshPhongMaterial( {
	specular: 0xffffff,
	shininess: 10,
	map: splats,
	normalMap: texture( 'wrinkle-normal.jpg' ),
	normalScale: new THREE.Vector2( .15, .15 ),
	transparent: true,
	depthTest: true,
	depthWrite: false,
	polygonOffset: true,
	polygonOffsetFactor: - 4,
	vertexColors: true
} );

// every splat in one geometry, drawn at once: when it's full, the oldest splats make room for the new ones
const MAX_TRIANGLES = 60000;
const batch = new DecalBatch( { tangents: true, maxVertices: MAX_TRIANGLES * 3 } );

const decals = new THREE.Mesh( batch, decalMaterial );
decals.frustumCulled = false;
scene.add( decals );

// the triangles of the splats, to look at what was cut
const wires = new THREE.Mesh( batch, new THREE.MeshBasicMaterial( { vertexColors: true, wireframe: true, polygonOffset: true, polygonOffsetFactor: - 4 } ) );
wires.frustumCulled = false;
wires.visible = false;
scene.add( wires );

const params = {
	projection: signal( 'normal' ),
	minScale: signal( 10 ),
	maxScale: signal( 30 ),
	maxAngle: signal( 90 ),
	rotate: signal( true ),
	fade: signal( true ),
	lifetime: signal( 0 ),
	wireframe: signal( false ),
	splats: signal( 0 ),
	triangles: signal( 0 )
};

const gui = new GUI( 'Decals', document.getElementById( 'gui-container' ) );
gui.addSelect( 'projection', params.projection, [ [ 'camera', 'From cam to mesh' ], [ 'normal', 'Normal to mesh' ] ] );
gui.addSlider( 'minScale', params.minScale, 1, 30, .1 );
gui.addSlider( 'maxScale', params.maxScale, 1, 30, .1 );
gui.addSlider( 'maxAngle', params.maxAngle, 0, 180, 1 );
gui.addCheckbox( 'rotate', params.rotate );
gui.addCheckbox( 'fade the edges', params.fade );
gui.addSlider( 'lifetime', params.lifetime, 0, 30, 1 );
gui.addText( 'The seconds that a splat lasts before it fades away. At 0 they stay.' );
gui.addCheckbox( 'wireframe', params.wireframe );
gui.addButton( 'clear', removeDecals );
gui.addSeparator();
gui.addMonitor( 'splats', params.splats, { format: v => String( v ) } );
gui.addMonitor( 'triangles', params.triangles, { format: v => v + ' of ' + MAX_TRIANGLES } );
gui.addText( 'All of them are one geometry, drawn at once. When it is full, the oldest splats make room for the new ones. A splat goes over everything it reaches, the head and what it stands on.' );

// what the splats are cut from: the head and what it stands on
const target = new THREE.Group();
scene.add( target );

let mesh = null;

// every splat has the next color of the wheel
let hue = 0;
const color = new THREE.Color();

// where the pointer is on the mesh, as the raycaster returns it
let hit = null;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// an arrow to where the pointer is, along the normal there: its tip is at the origin and it points along z, as lookAt() expects
const arrowMaterial = new THREE.MeshPhongMaterial( { color: 0xffffff, emissive: 0x555555 } );
const arrow = new THREE.Group();
arrow.add(
	new THREE.Mesh( new THREE.ConeGeometry( .32, 1.6, 20 ).rotateX( - Math.PI / 2 ).translate( 0, 0, .8 ), arrowMaterial ),
	new THREE.Mesh( new THREE.CylinderGeometry( .07, .07, 7, 12 ).rotateX( Math.PI / 2 ).translate( 0, 0, 5.1 ), arrowMaterial )
);
arrow.visible = false;
scene.add( arrow );

const helper = new THREE.Object3D();

new GLTFLoader().load( 'assets/LeePerrySmith.glb', function ( gltf ) {

	mesh = gltf.scene.children[ 0 ];
	mesh.material = new THREE.MeshPhongMaterial( {
		map: texture( 'Map-COL.jpg' ),
		specularMap: texture( 'Map-SPEC.jpg' ),
		normalMap: texture( 'Map-NOR.jpg' ),
		shininess: 10
	} );

	mesh.scale.set( 10, 10, 10 );
	target.add( mesh );

	const bounds = new THREE.Box3().setFromObject( mesh );
	const plinth = new THREE.Mesh(
		new THREE.CylinderGeometry( 13, 15, 14, 64, 8 ),
		new THREE.MeshPhongMaterial( { color: 0x555555, shininess: 10 } )
	);
	plinth.position.set( 0, bounds.min.y - 5.5, - 3 );
	target.add( plinth );

	// the grid that finds the triangles of each mesh is made in a worker, so the first splat doesn't wait for it
	target.updateMatrixWorld( true );
	prepareAsync( target );

} );

function checkIntersection() {

	hit = null;

	// nothing to point at until the pointer is over the mesh
	arrow.visible = false;

	if ( mesh === null ) return;

	raycaster.setFromCamera( mouse, camera );

	hit = raycaster.intersectObject( target, true )[ 0 ] || null;

	if ( hit === null ) return;

	const normal = hit.face.normal.clone().transformDirection( hit.object.matrixWorld );

	arrow.position.copy( hit.point );
	arrow.lookAt( normal.multiplyScalar( 10 ).add( hit.point ) );
	arrow.visible = true;

}

function shoot() {

	if ( hit === null ) return;

	const scale = params.minScale() + Math.random() * ( params.maxScale() - params.minScale() );
	const angle = params.rotate() ? Math.random() * 2 * Math.PI : 0;

	const options = {
		maxAngle: params.maxAngle(),
		fade: params.fade(),
		color: color.setHSL( hue, 1, .5 ),
		uvRect: cells[ Math.floor( Math.random() * cells.length ) ]
	};

	if ( params.projection() === 'camera' ) {

		// the box looks back along the way the camera looks
		helper.quaternion.copy( camera.quaternion );
		helper.rotateZ( angle );

		batch.add( target, hit.point, helper.rotation, new THREE.Vector3( scale, scale, scale ), options );

	} else {

		// along the way the surface looks where it was hit, over everything that is there
		batch.addFromIntersection( hit, scale, { ...options, angle, target } );

	}

	hue = ( hue + .09 ) % 1;

}

function removeDecals() {

	batch.clear();

}

function point( event ) {

	mouse.x = ( event.clientX / window.innerWidth ) * 2 - 1;
	mouse.y = - ( event.clientY / window.innerHeight ) * 2 + 1;

	checkIntersection();

}

effect( function () {

	const wireframe = params.wireframe();

	decals.visible = ! wireframe;
	wires.visible = wireframe;

} );

// a press that is released where it started shoots, one that travels is a drag of the camera
const pressed = new THREE.Vector2();
let pressing = false;

renderer.domElement.addEventListener( 'pointerdown', function ( event ) {

	if ( ! event.isPrimary || event.button !== 0 ) return;

	pressing = true;
	pressed.set( event.clientX, event.clientY );
	point( event );

} );

window.addEventListener( 'pointermove', point );

window.addEventListener( 'pointerup', function ( event ) {

	if ( ! pressing || ! event.isPrimary ) return;

	pressing = false;

	if ( pressed.distanceTo( new THREE.Vector2( event.clientX, event.clientY ) ) > 6 ) return;

	// where the camera is now, in case the press moved it a little
	camera.updateMatrixWorld();
	point( event );
	shoot();

} );

window.addEventListener( 'pointercancel', () => pressing = false );

window.addEventListener( 'resize', function () {

	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();

	renderer.setSize( window.innerWidth, window.innerHeight );

} );

function render() {

	requestAnimationFrame( render );

	// the splats that are too old fade and go
	batch.lifetime = params.lifetime() || Infinity;
	batch.update();

	params.splats.set( batch.decals.length );
	params.triangles.set( batch.decals.reduce( ( sum, decal ) => sum + decal.count, 0 ) / 3 );

	renderer.render( scene, camera );

}

render();
</script>

	</body>
</html>
